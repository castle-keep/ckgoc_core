name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Errors and warnings fail the build. Existing infos (deprecations) do not.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      # The docs site is deployed to GitHub Pages, so gate it too.
      - name: Docs app tests
        working-directory: doc/flutter_docs
        run: |
          flutter pub get
          flutter test

  mcp:
    name: MCP build and smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run smoke
