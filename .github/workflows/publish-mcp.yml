name: Publish MCP server

on:
  push:
    tags:
      - 'mcp-v*'

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Tag must match package.json version
        run: |
          pkg="mcp-v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ($pkg)"; exit 1
          fi

      - name: NPM_TOKEN secret must exist
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is empty or missing. Add an npm Automation token under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Smoke test (server starts, lists tools, every tool answers)
        run: npm run smoke

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
